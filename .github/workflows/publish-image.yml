# Publishes this fork's agentgateway image to GHCR for AllSpark, built with agentgateway's own Dockerfile.
name: Publish image
on:
  push:
    branches: [fix/extmcp-explicit-mcp-error]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=1.6.0-extmcp
            GIT_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:extmcp
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
